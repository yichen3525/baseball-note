name: 更新比賽資料並部署網站

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 14 * * *'   # 台灣時間 22:40
    - cron: '20 16 * * *'   # 台灣時間 00:20
    - cron: '10 3 * * *'    # 台灣時間 11:10
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 抓取比賽資料
        continue-on-error: true
        run: node scripts/update-games.mjs

      - name: 把更新後的資料存回 repo
        run: |
          if [ -n "$(git status --porcelain data/games.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/games.json
            git commit -m "更新比賽資料"
            git pull --rebase --autostash origin main || true
            git push || echo "存回失敗，下次排程會再試一次"
          else
            echo "比賽資料沒有變動"
          fi

      - name: 打包網站
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布網站
        id: deployment
        uses: actions/deploy-pages@v5
